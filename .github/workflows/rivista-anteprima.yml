name: Field Notes preview PDF (temporary)
# Builds a preview of the Field Notes monthly issue from fabio-costa-ph and saves it on the branch "anteprima".
on:
  workflow_dispatch:
    inputs:
      mese: { description: "Month, e.g. 2026-11", required: true }
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { repository: fabiocostantini25491/fabio-costa-ph }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: |
          npm install --no-save --no-package-lock playwright@1
          npx playwright install --with-deps chromium
      - run: node scripts/build-rivista.cjs --mese "${{ inputs.mese }}" --out dist/rivista.pdf --meta dist/rivista.json
      - name: Save on branch anteprima
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          cd dist
          git init -q -b anteprima
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add . && git commit -qm "Preview ${{ inputs.mese }}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" anteprima
